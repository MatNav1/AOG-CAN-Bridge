name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g. 1.2.3), without a leading v'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          }
          else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build AOG CAN Bridge
        shell: pwsh
        run: dotnet build AogCanBridge/AogCanBridge.csproj -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Configure bridge proxy (CMake)
        shell: pwsh
        run: cmake -S PcanBasicBridgeClient -B PcanBasicBridgeClient/build -A x64

      - name: Build bridge proxy
        shell: pwsh
        run: cmake --build PcanBasicBridgeClient/build --config Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after installing Inno Setup.' }
          & $iscc.FullName installer\Setup.iss "/DMyAppVersion=${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AOG CAN Bridge v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/*.exe
