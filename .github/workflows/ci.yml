name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build AOG CAN Bridge
        shell: pwsh
        run: dotnet build AogCanBridge/AogCanBridge.csproj -c Release
